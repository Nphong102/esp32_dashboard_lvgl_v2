; ═══════════════════════════════════════════════════════════════
; ETS2 Dashboard — Minimal (WiFi + LVGL TFT)
; Board: Freenove ESP32-S3 WROOM
; ═══════════════════════════════════════════════════════════════

[env:9341]
platform  = espressif32
board     = freenove_esp32_s3_wroom
framework = arduino

; Partition cần đủ chỗ cho LVGL + fonts (~1.5MB app)
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed   = 921600
monitor_speed  = 115200
;monitor_filters = esp32_exception_decoder

; ── Libraries ──────────────────────────────────────────────────
lib_deps =
  lvgl/lvgl @ ^8.3.11
  lovyan03/LovyanGFX @ ^1.2.7
  bblanchon/ArduinoJson @ ^7.0.4
  adafruit/Adafruit INA219 @ ^1.2.3

; ── Build flags ────────────────────────────────────────────────
build_flags =
  ; LVGL: trỏ lv_conf.h tới include/ của project
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I src
  ; PSRAM
  -D BOARD_HAS_PSRAM=1
  -mfix-esp32-psram-cache-issue
  -D DISPLAY_ILI9341
  ; Debug level (đặt 0 khi production)
  -D CORE_DEBUG_LEVEL=0
  
; ═══════════════════════════════════════════════════════════════
; Nạp firmware qua WiFi:  pio run -e ota -t upload
; upload_port: đổi thành IP của thiết bị nếu ets2-dash.local không dùng được
; --auth phải khớp OTA_PASSWORD trong config.h
; ═══════════════════════════════════════════════════════════════
[env:ota]
extends = env:9341
upload_protocol = espota
upload_port = ets2-dash.local
upload_flags =
  --auth=ets2ota

[env:st7789]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  ${env:9341.lib_deps} 
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

board_build.psram_type = opi
build_flags =

  ; LVGL: trỏ lv_conf.h tới include/ của project
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I src
  ; PSRAM
  -D BOARD_HAS_PSRAM=1
  -mfix-esp32-psram-cache-issue

  ; Debug level (đặt 0 khi production)
  -D CORE_DEBUG_LEVEL=0
     -D USER_SETUP_LOADE=1
    -D USE_HSPI_PORT=1              ; Bắt buộc với ESP32-S3 (tránh crash)
    -D DISPLAY_ST7789
    ; === Chọn driver màn hình ===
    ;-D ILI9341_DRIVER=1             ; 2.8" phổ biến (đổi nếu là ST7789, GC9A01...)
     -D ST7789_DRIVER=1
    ; -D GC9A01_DRIVER=1
    -D TFT_INVERSION_OFF=1
    -D TFT_RGB_ORDER=0
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D BATTERY_I2C_SDA_PIN=22
    -D BATTERY_I2C_SCL_PIN=21
    ; === Chân SPI (SỬA THEO MẠCH CỦA BẠN) ===
    -D TFT_MOSI=7
    -D TFT_SCLK=15
    -D TFT_CS=4
    -D TFT_DC=6
    -D TFT_RST=5
    -D TFT_BL=16                    ; Backlight (nếu có)
    -D TFT_MISO=-1                  ; Không dùng thì để -1

    -D TFT_BACKLIGHT_ON=HIGH

    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000